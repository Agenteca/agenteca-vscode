name: Release
# Packages the extension and publishes it when a tag vX.Y.Z is pushed.
#
# Publishing uses trusted publishing (OIDC): no token is stored in this repository.
#   Open VSX: the namespace owner registers this workflow at open-vsx.org/user-settings/trusted-publishers,
#     then sets the repository variable PUBLISH_OPENVSX to true.
#   Visual Studio Marketplace: the publisher owner creates a Trusted Publishing policy for this workflow
#     on marketplace.visualstudio.com/manage, then sets the repository variable PUBLISH_MARKETPLACE to true.
# A channel whose variable is not true is skipped. The .vsix is always attached to the GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteca-core
          path: agenteca-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteca-cli
          path: agenteca-cli
      - uses: actions/checkout@v4
        with:
          path: agenteca-vscode
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
        working-directory: agenteca-vscode
      - name: Workspace
        run: |
          echo '{"private": true, "workspaces": ["agenteca-core", "agenteca-cli", "agenteca-vscode"]}' > package.json
          npm install --no-audit --no-fund
          npm run build -w agenteca-core
          npm run build -w agenteca-cli
      - name: Package
        run: npm run package
        working-directory: agenteca-vscode
      - name: Publish to Open VSX
        if: vars.PUBLISH_OPENVSX == 'true'
        run: npx -y ovsx@1.4.0 publish --packagePath *.vsix --trusted-publishing
        working-directory: agenteca-vscode
      - name: Publish to the Visual Studio Marketplace
        if: vars.PUBLISH_MARKETPLACE == 'true'
        run: npx -y @vscode/vsce@4.1.1 publish --packagePath *.vsix --oidc
        working-directory: agenteca-vscode
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." --verify-tag
        working-directory: agenteca-vscode
        env:
          GH_TOKEN: ${{ github.token }}
